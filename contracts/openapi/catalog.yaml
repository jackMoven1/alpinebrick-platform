openapi: 3.1.0
info:
  title: ImagiBricks Catalog API
  version: 1.0.0
  description: >-
    API contract for the ImagiBricks product catalog (read + availability).
    v1 surface is frozen per ADR-0001. All response fields are snake_case.
    Search is case-insensitive substring matching (not relevance-ranked);
    a relevance engine is a future ADR. Slug lookup, faceted navigation,
    related products, and an image CDN are explicitly out of scope for v1.
servers:
  - url: /api/v1/catalog
paths:
  /products:
    get:
      summary: List products
      description: >-
        Returns a paginated envelope of products. Defaults to published-only.
        Supports filtering by category, case-insensitive substring search over
        name + description, and a frozen sort enum.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: published
          in: query
          required: false
          description: >-
            Filter by publish state. When omitted, only published products are
            returned.
          schema:
            type: boolean
        - name: category
          in: query
          required: false
          description: >-
            Single exact-match category. Matches if the value is present in the
            product's categories array.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive substring matched against name and description.
            v1 is substring-only, not relevance-ranked.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            Sort order. `name_asc` (default), `price_asc`, `price_desc`,
            `newest`. price_asc/price_desc sort by the product's minimum variant
            price (its cheapest variant); products with no variants sort last.
            `newest` sorts by created_at descending.
          schema:
            type: string
            enum: [name_asc, price_asc, price_desc, newest]
            default: name_asc
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'
        '400':
          description: Invalid pagination or sort parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{product_id}:
    get:
      summary: Get product by ID
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{product_id}/availability:
    get:
      summary: Get SKU availability for a product
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAvailability'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ProductListEnvelope:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          description: Full unpaginated count of products matching the filters.
        page:
          type: integer
        limit:
          type: integer
    Product:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        published:
          type: boolean
        categories:
          type: array
          items:
            type: string
        images:
          type: array
          description: >-
            Display-ordered images. The first element is the primary image.
          items:
            $ref: '#/components/schemas/Image'
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
    Image:
      type: object
      required: [url, alt]
      properties:
        url:
          type: string
          description: Plain absolute-or-relative image URL (CDN-agnostic for v1).
        alt:
          type: string
          description: Human-authored alternative text (WCAG 2.1 AA).
    ProductVariant:
      type: object
      properties:
        id:
          type: string
        product_id:
          type: string
        sku:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
        inventory_item_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductAvailability:
      type: object
      required: [product_id, available, variants]
      properties:
        product_id:
          type: string
        available:
          type: boolean
        variants:
          type: array
          items:
            type: object
            required: [sku_id, available_quantity]
            properties:
              sku_id:
                type: string
              available_quantity:
                description: >-
                  Returns null until the catalog-inventory integration lands
                  (separate ADR). Consumers treat null as "unknown".
                type: [integer, 'null']
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable token.
          enum: [NOT_FOUND, VALIDATION_ERROR, INTERNAL]
        message:
          type: string
          description: Human-readable error message.
        fields:
          type: object
          description: Optional per-field validation detail.
          additionalProperties:
            type: string
