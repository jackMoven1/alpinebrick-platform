openapi: 3.1.0
info:
  title: AlpineBrick Catalog API
  version: 3.0.0
  description: >-
    API contract for the AlpineBrick product catalog (read + availability).

    This document describes `systems/core` AS BUILT. Per the ADR-0001 amendment
    of 2026-08-12, core is the source of truth for this surface: the v1 contract
    frozen in ADR-0001 was never implemented as written, and core — running,
    tested and merged — won on shape. Field names are camelCase, the page-size
    parameter is `pageSize`, and all money is an integer count of cents.

    Images are returned as immutable storage KEYS, never URLs, and only images
    in the `ready` state are returned. See the ADR-0001 amendment of
    2026-08-13.

    Money is NEVER a float. The v1 contract typed price as `number/float`;
    floating-point dollars accumulate representation error and the repository's
    money convention forbids estimated figures.

    Search is case-insensitive substring matching over product name (not
    relevance-ranked); a relevance engine is ADR-0003. An image CDN is ADR-0002.
    Both remain DRAFT and are Jack's spend decisions.
servers:
  - url: /api/v1/catalog
paths:
  /products:
    get:
      summary: List products
      description: >-
        Returns a paginated envelope of published products. Supports filtering by
        category, case-insensitive substring search over name, and a six-value
        sort enum.

        Invalid `page`, `pageSize` or `sort` values are REJECTED with
        VALIDATION_ERROR rather than clamped or silently ignored — a silently
        ignored bad parameter returns plausible wrong results, which is harder
        to notice than an error.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: category
          in: query
          required: false
          description: >-
            Single exact-match category. Matches if the value is present in the
            product's `categories` array. Values are lowercase kebab-case slugs
            (`architecture`, `limited-edition`) — never display casing.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive substring matched against product name. Substring
            only, not relevance-ranked.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            Sort order.

            `name_asc` (default) — product name ascending.

            `price_asc` / `price_desc` — by the product's MINIMUM variant price
            (its cheapest variant); products with no variants sort last.

            `newest` — `createdAt` descending.

            `home_display` — merchandised order for the home page, by
            `homePosition` ascending.

            `collection_display` — merchandised order within a collection, by
            `collectionPosition` ascending.

            Both `*_display` sorts place unranked (null-position) products LAST
            and break ties on product name, so pagination is stable.
          schema:
            type: string
            enum: [name_asc, price_asc, price_desc, newest, home_display, collection_display]
            default: name_asc
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'
        '400':
          description: Invalid pagination or sort parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{idOrSlug}:
    get:
      summary: Get product by id or slug
      parameters:
        - name: idOrSlug
          in: path
          required: true
          description: Either the product's id or its unique slug.
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{idOrSlug}/availability:
    get:
      summary: Get per-variant availability for a product
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability per variant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariantAvailability'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ProductListEnvelope:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          description: Full unpaginated count of products matching the filters.
        page:
          type: integer
        pageSize:
          type: integer
    Product:
      type: object
      required: [id, slug, name, description, productType, releaseType, status, images, categories, variants]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        productType:
          type: string
          enum: [own_designed, resale]
        releaseType:
          type: string
          enum: [standard, limited_run, specialty]
        status:
          type: string
          enum: [draft, published, archived]
        categories:
          type: array
          description: Lowercase kebab-case slugs.
          items:
            type: string
        images:
          type: array
          description: >-
            Images ordered by `position`; position 0 is the primary image.
            Only images in the `ready` state appear — a partially uploaded
            image is never returned.
          items:
            $ref: '#/components/schemas/Image'
        pieces:
          type: [integer, 'null']
        difficulty:
          type: [string, 'null']
          enum: [beginner, intermediate, advanced, expert, null]
        ageRecommendation:
          type: [string, 'null']
        dimensions:
          type: [string, 'null']
        longDescription:
          type: string
        features:
          type: array
          items:
            type: string
        includes:
          type: array
          items:
            type: string
        builderNotes:
          type: string
        homePosition:
          type: [integer, 'null']
          description: >-
            Merchandised display order on the home page, ascending. Null means
            unranked, which sorts LAST — never first.
        collectionPosition:
          type: [integer, 'null']
          description: >-
            Merchandised display order within a collection, ascending, and
            independent of homePosition. Null sorts LAST.

            Known limitation: `categories` is an array, so a product belonging
            to several collections carries one position and holds the same rank
            in each.
        createdAt:
          type: string
          format: date-time
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    Image:
      type: object
      required: [storageKey, alt, width, height, position]
      properties:
        storageKey:
          type: string
          description: >-
            Immutable storage key, format products/{productId}/{imageId}/original.{ext}.
            NOT a URL. Consumers compose a delivery URL from this key, so the CDN
            host and transform grammar can change without touching any data.
            Bytes are never replaced in place, so derivative URLs built from this
            key are safe to cache at the edge indefinitely.
        alt:
          type: string
          description: >-
            Human-authored alternative text (WCAG 2.1 AA). May be empty for
            decorative images; empty alt is a publish-time warning, not an error.
        width:
          type: integer
          description: >-
            Intrinsic pixel width, read from storage at upload rather than
            supplied by the client. Lets clients reserve layout space instead of
            reflowing as images load.
        height:
          type: integer
          description: Intrinsic pixel height, read from storage at upload.
        position:
          type: integer
          description: Display order within the product. position 0 is the primary image.
    Variant:
      type: object
      required: [id, sku, priceCents, currency]
      properties:
        id:
          type: string
        sku:
          type: string
        priceCents:
          type: integer
          description: >-
            Price as an INTEGER COUNT OF CENTS. Never a float, never dollars.
        currency:
          type: string
    VariantAvailability:
      type: object
      required: [variantId, sku, available]
      properties:
        variantId:
          type: string
        sku:
          type: string
        available:
          type: integer
          description: onHand minus reserved.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable token.
          enum: [NOT_FOUND, VALIDATION_ERROR, INTERNAL]
        message:
          type: string
          description: Human-readable error message.
        fields:
          type: object
          description: Per-field validation detail, present on VALIDATION_ERROR.
          additionalProperties:
            type: string
