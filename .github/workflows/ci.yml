name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: core_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: systems/core
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5433/core_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: systems/core/package-lock.json
      - run: npm ci
      # Runs every migration against an empty database. This is the step that
      # catches a migration whose timestamp sorts before the one it depends on.
      - run: npx prisma migrate deploy
      - run: npx vitest run
      # A green suite does not mean the app compiles: vitest resolves
      # TypeScript directly and never touches compiled output.
      - run: npm run build

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: systems/storefront/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx vitest run
      # `build` is `tsc -b && vite build`, so this also typechecks. Keep it
      # AFTER the tests: a component can pass its tests and still fail to
      # compile, and the compile error is the more useful failure to surface.
      - run: npm run build
