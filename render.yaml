# AlpineBrick platform — Render Blueprint
#
# Implements docs/architecture/2026-08-03-deployment-architecture.md.
# Hosting choice is ADR-0004 (Accepted, Jack 2026-08-03).
#
# Two Blueprint instances are created from this one file: production synced to
# `main`, staging synced to `staging`. See the bootstrap notes at the bottom —
# a few steps are necessarily dashboard-side and cannot live in this file.
#
# NOTE: creating these resources incurs recurring spend. Per the standing rule,
# Jack creates the account and approves the plans; nothing here provisions
# anything on its own.

previews:
  generation: automatic # PR preview environments (API + storefront)

services:
  # ---------------------------------------------------------------- core-api
  - type: web
    name: core-api
    runtime: docker
    rootDir: systems/core
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Runs inside the built image before traffic shifts, so a deploy carrying a
    # failing migration never goes live. Requires the prisma CLI to be a
    # production dependency — it is.
    preDeployCommand: npx prisma migrate deploy
    autoDeploy: true # pair with "wait for CI checks" in the dashboard
    envVars:
      - fromGroup: core-env
      - key: DATABASE_URL
        fromDatabase:
          name: core-db
          property: connectionString

  # ------------------------------------------------------------- storefront
  - type: web
    name: storefront
    runtime: static
    rootDir: systems/storefront/code
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # sync: false -- NOT a fixed value. This same file builds the production
      # Blueprint instance, the staging instance, and every automatic PR
      # preview (see `previews:` above); a hardcoded absolute URL here would
      # point the staging storefront and every preview at the *production*
      # catalog API, and previews would additionally get CORS-blocked since
      # their .onrender.com origins are never in STOREFRONT_ORIGIN below.
      # Set per instance in the Render dashboard before that instance's first
      # deploy. Left empty, the storefront falls back to a relative path
      # (today's dev-proxy behaviour) -- loud and obviously wrong rather than
      # silently pointed at the wrong environment.
      - key: VITE_API_BASE_URL
        sync: false

  # ------------------------------------------------------------ core-worker
  # DELIBERATELY COMMENTED OUT.
  #
  # The deployment architecture specifies a background worker running
  # `node dist/worker.js` for the Walmart outbox processor and pollers
  # (Walmart plan, Task 13). That code does not exist yet — there is no
  # src/worker.ts in systems/core.
  #
  # Enabling this now would provision a paid service that starts, finds no
  # entrypoint, and crash-loops. Uncomment as part of the Walmart integration
  # plan, once src/worker.ts is real.
  #
  # - type: worker
  #   name: core-worker
  #   runtime: docker
  #   rootDir: systems/core
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: node dist/worker.js
  #   plan: starter
  #   autoDeploy: true
  #   envVars:
  #     - fromGroup: core-env
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: core-db
  #         property: connectionString

databases:
  - name: core-db
    plan: basic-1gb
    ipAllowList: [] # private network only — never publicly reachable

envVarGroups:
  - name: core-env
    envVars:
      - key: WALMART_API_BASE
        value: https://marketplace.walmartapis.com
      - key: WALMART_SYNC_ENABLED
        value: "false" # flipped to true only at Walmart go-live
      # CORS allowlists for the two response-header factories in
      # systems/core/src/auth/cors.ts -- comma-separated, same parsing as
      # each other. Kept as two separate keys on purpose: the storefront must
      # never be permitted to call admin endpoints, which is exactly what the
      # auth work exists to prevent.
      #
      # Both sync: false, deliberately NOT a fixed value in this file. This
      # group is shared -- note 4 below already flagged it as unverified
      # whether Render scopes envVarGroups per Blueprint instance, and these
      # two keys are exactly where that ambiguity turns into a real bug if
      # guessed wrong:
      #   - ADMIN_CONSOLE_ORIGIN is not CORS-only -- require-origin.ts also
      #     403s admin writes against it, and auth.routes.ts uses it as the
      #     post-login OAuth redirect target. Pinned to one value across
      #     environments, a staging core would 403 the staging console's own
      #     writes and redirect staging logins to the *production* console.
      #   - STOREFRONT_ORIGIN pinned to production would silently CORS-block
      #     every staging or PR-preview storefront's catalog calls.
      # Set per instance in the Render dashboard before that instance's first
      # deploy. An empty ADMIN_CONSOLE_ORIGIN fails closed (every admin write
      # 403s); an empty STOREFRONT_ORIGIN means no catalog CORS headers at
      # all. Both are loud and obviously broken until configured -- that is
      # the deliberate trade against the silent cross-environment bleed a
      # shared hardcoded value would cause.
      - key: ADMIN_CONSOLE_ORIGIN
        sync: false
      # When this is set in the dashboard, list only www.alpinebrickexchange.com
      # (production) -- the apex (alpinebrickexchange.com) still resolves to
      # the live Shopify store (see bootstrap step 5 below), so it cannot be
      # added to the allowlist until the Phase 5 cutover repoints it. Add it,
      # comma-separated, at that point.
      - key: STOREFRONT_ORIGIN
        sync: false
      # Secrets are NEVER declared here. Set these in the Render dashboard,
      # per environment, entered by Jack:
      #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
      #   WALMART_CLIENT_ID, WALMART_CLIENT_SECRET, WALMART_WEBHOOK_SECRET
      # Staging uses Stripe test mode and the Walmart sandbox base URL.
# ---------------------------------------------------------------------------
# Bootstrap — dashboard steps this file cannot express
#
# 1. Create the Render account and connect the GitHub repo
#    (jackMoven1/alpinebrick-platform). Account creation and payment details
#    are Jack's; they are outside what an agent may do.
#
# 2. Create the `staging` branch from `main` before creating the staging
#    Blueprint instance — it does not exist yet.
#
# 3. Create two Blueprint instances from this file:
#      production -> tracks `main`
#      staging    -> tracks `staging`
#    Render appends its own suffixes; confirm the resulting resource names.
#    The architecture doc flags this as a one-time dashboard task to verify.
#
# 4. `envVarGroups` is named `core-env` (not `core-prod`) precisely because the
#    same file builds both environments. If Render does not scope the group per
#    instance in practice, create `core-prod` / `core-staging` by hand and
#    change `fromGroup` per instance. VERIFY THIS DURING BOOTSTRAP — it is the
#    one part of this Blueprint that could not be checked without an account.
#
# 5. Point Cloudflare DNS at the Render services once they are up:
#      www.alpinebrickexchange.com        -> storefront (production)
#      api.alpinebrickexchange.com        -> core-api   (production)
#      staging.alpinebrickexchange.com    -> storefront (staging)
#      api-staging.alpinebrickexchange.com-> core-api   (staging)
#    TLS mode Full (strict). The staging hostnames are still unconfirmed —
#    see the amendment note in the deployment architecture doc.
#
#    The apex and www currently resolve to the live Shopify store. Do NOT
#    repoint them until the Phase 5 cutover; bring staging up first.
#
# 6. Enable "wait for CI checks" on both instances so autoDeploy cannot ship a
#    red build.
# ---------------------------------------------------------------------------
